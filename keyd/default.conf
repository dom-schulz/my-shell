[ids]
# Built-in HP keyboard.
0001:0001
# Logitech K780 via the Unifying receiver and via Bluetooth.
046d:405b
046d:b33b

[main]
leftalt = layer(meta)
# Left Super sits where Option is on a Mac.
leftmeta = layer(alt)

[meta:M]
# GNOME opens its overview/search when Super is pressed, so left Alt alone
# already provides the desired search behavior.
# Consume Space here to avoid GNOME's Super+Space input-source shortcut and
# to prevent an unconfigured Super+/ search mapping from typing '/'.
space = noop

# Translate common macOS-style shortcuts to applications' Ctrl shortcuts.
c = C-c
v = C-v
x = C-x
a = C-a
r = C-r
z = C-z
s = C-s
f = C-f
l = C-l
n = C-n
t = C-t
w = C-w

# Cmd + arrows / backspace: line and document navigation, like macOS.
left = home
right = end
up = C-home
down = C-end
# Delete to the start of the line.
backspace = macro(S-home backspace)

# Ghostty splits right on this otherwise unused combination, which leaves
# GNOME's Super+D show-desktop shortcut alone.
d = C-A-M-d

# Alt+1-9 selects browser tabs.
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9

# Shortcuts for left Alt + Shift. keyd 2.5 rejects S- prefixed keys inside a
# layer, so these need a composite layer.
[meta+shift]
z = C-S-z
# Select to the start / end of the line or document.
left = S-home
right = S-end
up = C-S-home
down = C-S-end
# Super+L is GNOME's lock-screen shortcut.
l = M-l
# Ghostty splits down on this otherwise unused combination.
d = C-A-M-S-d

# Option + arrows/backspace: move or delete by word, like macOS.
[alt]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[alt+shift]
left = C-S-left
right = C-S-right

# Ctrl + Option + arrows snap windows, matching Rectangle on the Mac.
# They send GNOME's Super + arrow shortcuts.
[control+alt]
# Left / right half.
left = M-left
right = M-right
# Maximize. (No Down: GNOME's Super+Down can restore the window off screen.)
up = M-up

# Ctrl + Option + Cmd + left/right moves the window to the other monitor.
[control+alt+meta]
left = M-S-left
right = M-S-right

# Left Alt + Left Super + arrows (Cmd + Option on a Mac) move between Ghostty
# splits. Defined here so the line-navigation keys above don't take over.
[alt+meta]
left = A-M-left
right = A-M-right
up = A-M-up
down = A-M-down
