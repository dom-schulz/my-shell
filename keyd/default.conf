[main]
leftalt = layer(meta)
leftmeta = noop

[meta:M]
# GNOME opens its overview/search when Super is pressed, so left Alt alone
# already provides the desired search behavior.
# Consume Space here to avoid GNOME's Super+Space input-source shortcut and
# to prevent an unconfigured Super+/ search mapping from typing '/'.
space = noop

# Translate common macOS-style shortcuts to applications' Ctrl shortcuts.
c = C-c
v = C-v
x = C-x
a = C-a
r = C-r
z = C-z
s = C-s
f = C-f
l = C-l
n = C-n
t = C-t
w = C-w

# Ghostty splits right on this otherwise unused combination, which leaves
# GNOME's Super+D show-desktop shortcut alone.
d = C-A-M-d

# Alt+1-9 selects browser tabs.
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9

# Shortcuts for left Alt + Shift. keyd 2.5 rejects S- prefixed keys inside a
# layer, so these need a composite layer.
[meta+shift]
z = C-S-z
# Super+L is GNOME's lock-screen shortcut.
l = M-l
# Ghostty splits down on this otherwise unused combination.
d = C-A-M-S-d
